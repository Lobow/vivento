[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = [
    "B008",  # Depends(...) como valor default é o padrão idiomático do FastAPI
    "UP042", # str+Enum é o padrão usado para enums serializáveis pelo Pydantic
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
