server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Health check simples para orquestração cloud native (K8s liveness/readiness)
    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Assets com cache agressivo (nomes com hash gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: qualquer rota desconhecida cai no index.html
    # (o roteamento é feito no client-side pelo react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
