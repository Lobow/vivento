name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-management-back

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: event-management-back/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Rodar testes (pytest)
        env:
          SECRET_KEY: ci-test-secret
        run: pytest -q

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: event-management-back
          push: false
          tags: event-management-backend:ci

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-management-front

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: event-management-front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: event-management-front
          push: false
          tags: event-management-frontend:ci
